[build]
  publish = "dist"

[functions]
  directory = "netlify/functions"

[dev]
  targetPort = 3000

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
